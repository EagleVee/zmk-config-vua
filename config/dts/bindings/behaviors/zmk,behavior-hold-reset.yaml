description: |
  Reset behavior that only fires once the key has been held for a minimum
  duration, then released.

  Unlike the stock &sys_reset / &bootloader behaviors, this is safe to invoke
  from a zmk,kscan-sideband-behaviors entry pointed at a key that is also part
  of the normal matrix: a short tap does nothing, so the key keeps its usual
  meaning. Because sideband entries run locally, this works on a split
  peripheral even while it is disconnected from the central.

  Setting bootloader-hold-time-ms adds a second, longer tier that reboots into
  the bootloader. The tier is decided on release, so the shorter action is
  selected by releasing between the two thresholds.

compatible: "zmk,behavior-hold-reset"

include: zero_param.yaml

properties:
  hold-time-ms:
    type: int
    default: 3000
    description: Milliseconds the key must be held before releasing it triggers the reset.
  bootloader-hold-time-ms:
    type: int
    default: 0
    description: >
      Milliseconds the key must be held for the reset to enter the bootloader
      instead. Must be greater than hold-time-ms. 0 disables this second tier.
  bootloader:
    type: boolean
    description: >
      Make the hold-time-ms tier itself enter the bootloader, rather than
      rebooting back into the firmware.
  type:
    type: int
    default: 0
    description: Legacy sys_reboot() type, used only when boot retention is unavailable.
